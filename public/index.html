<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nova AI Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b1020;
      color: #eef3ff;
      font: 15px system-ui, sans-serif;
      height: 100vh;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 1050px;
      margin: auto;
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid #293653;
      background: #0d1527;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 800;
      font-size: 20px;
    }

    .logo span {
      color: #6ea8fe;
    }

    .status {
      font-size: 13px;
      color: #8fa3c7;
    }

    main {
      flex: 1;
      overflow: auto;
      padding: 20px;
    }

    .chat {
      max-width: 850px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 85%;
      padding: 13px 15px;
      border-radius: 14px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .user {
      align-self: flex-end;
      background: #24529a;
    }

    .ai {
      align-self: flex-start;
      background: #121a2d;
      border: 1px solid #293653;
    }

    .composer {
      border-top: 1px solid #293653;
      padding: 14px;
      background: #0d1527;
    }

    .row {
      max-width: 850px;
      margin: auto;
      display: flex;
      gap: 8px;
    }

    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 180px;
      resize: none;
      background: #121a2d;
      color: #eef3ff;
      border: 1px solid #293653;
      border-radius: 12px;
      padding: 12px;
      font: inherit;
      outline: none;
    }

    textarea:focus {
      border-color: #6ea8fe;
    }

    button {
      border: 1px solid #293653;
      background: #18233b;
      color: #eef3ff;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font: inherit;
    }

    button:hover {
      background: #223252;
    }

    button.primary {
      background: #6ea8fe;
      color: #08101f;
      border: 0;
      font-weight: 700;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .msg {
        max-width: 92%;
      }

      .row {
        align-items: flex-end;
      }

      button.primary {
        padding: 10px 13px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">
      Nova <span>AI Studio</span>
    </div>

    <div class="status">
      Ready
    </div>
  </header>

  <main>
    <div id="chat" class="chat"></div>
  </main>

  <div class="composer">

    <div class="row">

      <textarea
        id="p"
        placeholder="Message Nova AI..."
        autocomplete="off"
      ></textarea>

      <button
        class="primary"
        id="send"
      >
        Send
      </button>

    </div>

  </div>

</div>

<script>

const $ = x => document.getElementById(x);

function esc(s) {
  return s.replace(
    /[&<>"']/g,
    c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c])
  );
}

function add(text, type = "ai") {

  const d = document.createElement("div");

  d.className = "msg " + type;

  d.innerHTML = text;

  $("chat").appendChild(d);

  d.scrollIntoView({
    behavior: "smooth",
    block: "end"
  });

  return d;
}

async function post(url, body) {

  const response = await fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  });

  let data = {};

  try {
    data = await response.json();
  } catch {
    data = {};
  }

  if (!response.ok) {
    const error = new Error(
      data.error || "Request failed"
    );

    error.status = response.status;

    throw error;
  }

  return data;
}

async function sendMessage() {

  const prompt = $("p").value.trim();

  if (!prompt) {
    return;
  }

  $("p").value = "";

  add(esc(prompt), "user");

  const thinking = add("Thinking...", "ai");

  $("send").disabled = true;

  try {

    const data = await post("/api/chat", {
      prompt: prompt
    });

    thinking.textContent =
      data.text || "No response returned.";

  } catch (error) {

    console.error(error);

    thinking.textContent =
      "Sorry, I couldn't process that message right now. Please try again.";

  } finally {

    $("send").disabled = false;

    $("p").focus();

  }
}

$("send").onclick = sendMessage;

$("p").addEventListener("keydown", event => {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    sendMessage();

  }

});

add(
  "Hi! I'm Nova AI. How can I help you today?",
  "ai"
);

</script>

</body>
</html>
