<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova AI Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef3ff;font:15px system-ui;height:100vh}.app{height:100vh;display:flex;flex-direction:column;max-width:1050px;margin:auto}header{padding:16px 20px;border-bottom:1px solid #293653;background:#0d1527;display:flex;justify-content:space-between}.logo{font-weight:800;font-size:20px}.logo span{color:#6ea8fe}main{flex:1;overflow:auto;padding:20px}.chat{max-width:850px;margin:auto;display:flex;flex-direction:column;gap:12px}.msg{max-width:85%;padding:13px 15px;border-radius:14px;white-space:pre-wrap;line-height:1.5}.user{align-self:flex-end;background:#24529a}.ai{background:#121a2d;border:1px solid #293653}.media img{max-width:100%;border-radius:12px;margin-top:8px}.composer{border-top:1px solid #293653;padding:14px;background:#0d1527}.row,.tools{max-width:850px;margin:auto;display:flex;gap:8px}.tools{margin-top:9px;flex-wrap:wrap}textarea{flex:1;min-height:48px;resize:none;background:#121a2d;color:#eef3ff;border:1px solid #293653;border-radius:12px;padding:12px;font:inherit}button{border:1px solid #293653;background:#18233b;color:#eef3ff;border-radius:10px;padding:10px 13px;cursor:pointer}button.primary{background:#6ea8fe;color:#08101f;border:0;font-weight:700}</style></head><body><div class="app"><header><div class="logo">Nova <span>AI Studio</span></div><div>Ready</div></header><main><div id="chat" class="chat"></div></main><div class="composer"><div class="row"><textarea id="p" placeholder="Message Nova AI..."></textarea><button class="primary" id="send">Send</button></div><div class="tools"><button id="img">🖼️ Generate image</button><button id="vid">🎬 Generate video</button></div></div></div><script>
const $=x=>document.getElementById(x);function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function add(t,c="ai"){let d=document.createElement("div");d.className="msg "+c;d.innerHTML=t;$("chat").appendChild(d);d.scrollIntoView({behavior:"smooth"});return d}async function post(u,b){let r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}),j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j}
$("send").onclick=async()=>{let p=$("p").value.trim();if(!p)return;$("p").value="";add(esc(p),"user");let w=add("Thinking…");try{let d=await post("/api/chat",{prompt:p});w.textContent=d.text||"No response returned."}catch(e){w.textContent="Error: "+e.message}};
$("img").onclick=async()=>{let p=$("p").value.trim();if(!p)return add("Type an image prompt first.");add("🖼️ "+esc(p),"user");let w=add("Generating image…");try{let d=await post("/api/image",{prompt:p});w.innerHTML="Generated image:<div class='media'><img src='"+d.url+"' alt='Generated image'></div>"}catch(e){w.textContent="Image error: "+e.message}};
$("vid").onclick=()=>add("🎬 The video button is ready, but this starter needs a currently supported video backend/provider connected before it can generate videos.");
$("p").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("send").click()}});add("Hi! I'm Nova AI. Users don't need to enter an API key.");
</script></body></html>
